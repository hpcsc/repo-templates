name: CI

on:
  push: {}

jobs:

  render-go-cli:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Mise install
      uses: jdx/mise-action@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Render
      run: task render-go-cli

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ./tmp/go-cli-project/go.mod

    - name: Run unit test for generated project
      working-directory: ./tmp/go-cli-project
      run: task test:unit

    - name: Run e2e test for generated project
      working-directory: ./tmp/go-cli-project
      run: task test:e2e

    - name: Run goreleaser local for generated project
      working-directory: ./tmp/go-cli-project
      run: task release:local

    - name: Run generated binary
      working-directory: ./tmp/go-cli-project/dist
      run: ./go-cli-project_linux_amd64_v1/go-cli-project --version

  render-go-worker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Mise install
      uses: jdx/mise-action@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Render
      run: task render-go-worker

    - name: Builder docker image
      working-directory: ./tmp/go-worker-project
      run: task docker:build

  render-chi-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Mise install
      uses: jdx/mise-action@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Render
      run: task render-chi-api

    - name: Builder docker image
      working-directory: ./tmp/chi-api-project
      run: task docker:build

  render-go-event-sourcing-service:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [example, minimal]
    steps:
    - uses: actions/checkout@v4

    - name: Mise install
      uses: jdx/mise-action@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'

    - name: Render
      run: task render-go-event-sourcing-service
      env:
        PRESET: ${{ matrix.preset }}

    - name: Run unit test for generated project
      working-directory: ./tmp/go-event-sourcing-service-project
      run: task test:unit

    - name: Run integration test for generated project
      working-directory: ./tmp/go-event-sourcing-service-project
      run: task test:integration

  test-go-event-sourcing-service-process-manager:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Mise install
      uses: jdx/mise-action@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'

    - name: Add the process manager to a project and compare
      run: task test-go-event-sourcing-service-process-manager

  render-asdf-plugin:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Mise install
      uses: jdx/mise-action@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Render a plugin (boilerplate)
      run: task render-asdf-plugin

    - name: List all versions of the plugin
      working-directory: ./tmp/asdf-plugin-boilerplate
      run: ./bin/list-all

    - name: Install and run a specific version of the plugin
      working-directory: ./tmp/asdf-plugin-boilerplate
      run: |
        ./bin/install
        ./tmp/bin/boilerplate -v
      env:
        ASDF_INSTALL_VERSION: '0.5.12'
        ASDF_INSTALL_PATH: ./tmp
