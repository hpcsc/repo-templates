messages:
  post: |
    # Process manager added

    The payment to another bank now runs as a process manager. The README section
    "Process Manager Example" tells how to run it, and docs/process-manager-example.md
    explains the design.

    Run `task migrate:up` or `task run` to create the payments and payment_deadlines
    tables. `task run` also starts the fake outside systems.

delimiters:
  - glob: "**/*.part"
    left: "[["
    right: "]]"
