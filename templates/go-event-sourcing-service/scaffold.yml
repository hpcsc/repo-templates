questions:
  - name: GoVersion
    prompt:
      message: "Go version"
      description: "1.27 or later: the registry, the command bus and the event store use generic methods"
      default: "1.27.1"
    validate:
      required: true
      match:
        regex: '^1\.(2[7-9]|[3-9][0-9])(\.[0-9]+)?$'
        message: "use Go 1.27 or later: the code uses generic methods"
  - name: ProcessManager
    prompt:
      confirm: "Include the process manager example, a payment to another bank?"
  - name: PushSubscriber
    prompt:
      confirm: "Include the push subscriber that broadcasts events to WebSocket clients?"
  - name: PushNATS
    prompt:
      confirm: "Use NATS (instead of pg_notify) for push delivery? Enables at-least-once delivery and scales to many API instances."

features:
  - value: "{{ .Scaffold.ProcessManager }}"
    globs:
      - "**/internal/use_cases/payment/**"
      - "**/internal/api/use_cases/payment/**"
      - "**/internal/api/use_cases/webhook/**"
      - "**/internal/use_cases/account/holds/**"
      - "**/internal/use_cases/account/hold.go"
      - "**/internal/use_cases/account/hold_test.go"
      - "**/internal/use_cases/account/event/hold_*.go"
      - "**/internal/use_cases/account/command/*_hold.go"
      - "**/internal/fakeservices/**"
      - "**/cmd/fakeservices/**"
      - "**/Taskfile.fakeservices.yml"
      - "**/Dockerfile.fakeservices"
      - "**/migrations/*_create-payments-table.*"
      - "**/migrations/*_create-payment-deadlines-table.*"
      - "**/docs/process-manager-example.md"
      - "**/docs/event-model-payment.*"
  - value: "{{ .Scaffold.PushSubscriber }}"
    globs:
      - "**/internal/api/use_cases/push_subscriber.go"
  - value: "{{ or .Scaffold.PushSubscriber .Scaffold.PushNATS }}"
    globs:
      - "**/internal/api/websocket/handler.go"
      - "**/internal/api/websocket/hub.go"
  - value: "{{ .Scaffold.PushNATS }}"
    globs:
      - "**/internal/api/websocket/nats_bridge.go"
      - "**/internal/use_cases/push_nats/**"
      - "**/internal/common/natspush/**"
      - "**/internal/common/config/nats.go"

delimiters:
  - glob: "**/Taskfile*.yml"
    left: "[["
    right: "]]"
  - glob: "**/.github/**"
    left: "[["
    right: "]]"

messages:
  post: |
    # All set

    An event-sourced service with a Postgres event store: an HTTP API that sends commands, and a
    `catchup` process that runs the projections and the reactions.
    {{- if .Scaffold.ProcessManager }}
    The payment to another bank runs as a process manager, and task run also starts
    fake outside systems for it.
    {{- end }}
    {{- if and .Scaffold.PushSubscriber (not .Scaffold.PushNATS) }}
    A push subscriber broadcasts events to WebSocket clients on a dedicated NOTIFY channel
    (`push_events`), with checkpointing to avoid replay on restart.
    {{- end }}
    {{- if .Scaffold.PushNATS }}
    A NATS push reactor in the catchup service and a NATS bridge in the API server deliver
    events to WebSocket clients with at-least-once delivery via JetStream.
    {{- end }}

        cd {{ .ProjectKebab }}
        task run              # Postgres, migrations, and the api and catchup processes in tmux
        task test:unit
        task test:integration

    README.md tells how to replace the example with your own domain.
    {{- if not .Scaffold.ProcessManager }}
    To add the process manager example later, run the go-event-sourcing-service-process-manager
    template scaffold in the project.
    {{- end }}

presets:
  example:
    Project: go-event-sourcing-service-project
    GoVersion: "1.27.1"
    ProcessManager: true
  minimal:
    Project: go-event-sourcing-service-project
    GoVersion: "1.27.1"
    ProcessManager: false
  push:
    Project: go-event-sourcing-service-project
    GoVersion: "1.27.1"
    ProcessManager: false
    PushSubscriber: true
    PushNATS: false
  nats:
    Project: go-event-sourcing-service-project
    GoVersion: "1.27.1"
    ProcessManager: false
    PushSubscriber: false
    PushNATS: true
