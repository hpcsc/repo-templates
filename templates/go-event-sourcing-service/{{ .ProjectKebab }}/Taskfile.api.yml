version: '3'

vars:
  API: http://127.0.0.1:3333
  AUTH: "Authorization: Bearer valid-token"

tasks:
  open-account:
    desc: "usage: task api:open-account -- owner-name"
    cmds:
      - |
        curl -s -X POST "{{.API}}/accounts" -H "{{.AUTH}}" \
          -d '{"owner": "{{default "alice" .CLI_ARGS}}"}' | jq

  deposit:
    desc: "usage: ID=<account-id> task api:deposit -- 500"
    cmds:
      - |
        curl -s -X POST "{{.API}}/accounts/${ID}/deposits" -H "{{.AUTH}}" \
          -d '{"amount": {{default "500" .CLI_ARGS}}}' | jq

  withdraw:
    desc: "usage: ID=<account-id> task api:withdraw -- 200"
    cmds:
      - |
        curl -s -X POST "{{.API}}/accounts/${ID}/withdrawals" -H "{{.AUTH}}" \
          -d '{"amount": {{default "200" .CLI_ARGS}}}' | jq

  close-account:
    desc: "usage: ID=<account-id> task api:close-account"
    cmds:
      - curl -s -X POST "{{.API}}/accounts/${ID}/close" -H "{{.AUTH}}" | jq

  get-account:
    desc: "usage: ID=<account-id> task api:get-account"
    cmds:
      - curl -s "{{.API}}/accounts/${ID}" -H "{{.AUTH}}" | jq

  run:
    cmds:
      - go run ./cmd/api
    env:
      TOKEN_PATH: local/api/token
      DB_HOST: localhost
      DB_NAME: events
      DB_USERNAME: local-user
      DB_PASSWORD: local-password
      DB_HOST_PORT: 45432
[[- if .Scaffold.PushNATS ]]
      NATS_URL: nats://127.0.0.1:4222
[[- end ]]

  build:
    cmds:
      - mkdir -p ./bin
      - go build --ldflags "-extldflags -static -X 'github.com/hpcsc/[[ .ProjectKebab ]]/internal/api/use_cases/root.Version=${VERSION}'" -o ./bin/api ./cmd/api
    env:
      CGO_ENABLED: '0'
      VERSION: ${VERSION:-main}

  docker:build:
    cmds:
      - |
        docker build \
          -t [[ .ProjectKebab ]]-api:{{ default "latest" .TAG }} \
          -f Dockerfile.api \
          --build-arg=VERSION=$(git rev-parse HEAD 2>/dev/null || echo main) \
          .

[[- if .Scaffold.ProcessManager ]]

  pay:
    desc: "usage: ID=<account-id> [IBAN=<creditor IBAN>] task api:pay -- 300"
    cmds:
      - |
        curl -s -X POST "{{.API}}/payments" -H "{{.AUTH}}" \
          -d "{\"accountId\": \"${ID}\", \"creditorIban\": \"${IBAN:-DE89370400440532013000}\", \"amount\": {{default "300" .CLI_ARGS}}}" | jq

  get-payment:
    desc: "usage: PAYMENT=<payment-id> task api:get-payment"
    cmds:
      - curl -s "{{.API}}/payments/${PAYMENT}" -H "{{.AUTH}}" | jq
[[- end ]]
