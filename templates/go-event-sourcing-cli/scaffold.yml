questions:
  - name: GoVersion
    prompt:
      message: "Go version"
      default: "1.27.1"
    validate:
      required: true
  - name: SQLite
    prompt:
      confirm: "Include the SQLite store, which keeps the events between commands?"

features:
  - value: "{{ .Scaffold.SQLite }}"
    globs:
      - "**/internal/store/sqlite.go"
      - "**/internal/store/sqlite_test.go"
      - "**/internal/schema/**"
      - "**/internal/cli/store_path.go"
      - "**/internal/cli/sqlite_test.go"

delimiters:
  - glob: "**/Taskfile*.yml"
    left: "[["
    right: "]]"

messages:
  post: |
    # All set

    An event-sourced command-line application with one example: an account that a command opens,
    credits and shows.
    {{- if .Scaffold.SQLite }}
    The SQLite store keeps the events between commands.
    {{- else }}
    The in-memory store keeps the events only while one command runs. To add the SQLite store later,
    run the go-event-sourcing-cli-sqlite template scaffold in the project.
    {{- end }}

        cd {{ .ProjectKebab }}
        task run -- open   --id acc-1 --owner "Ada Lovelace"
        task run -- credit --id acc-1 --amount 500 --ref invoice-7
        task run -- show   --id acc-1
        task test:unit

    README.md tells how to add a use case and how to change an event.

presets:
  example:
    Project: go-event-sourcing-cli-project
    GoVersion: "1.27.1"
    SQLite: true
  minimal:
    Project: go-event-sourcing-cli-project
    GoVersion: "1.27.1"
    SQLite: false
