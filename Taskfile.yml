version: '3'

tasks:
  render-go-cli:
    desc: render go-cli template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/go-cli
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          ./templates/global/git-hook
    env:
      NAME:
        sh: echo ${NAME:-go-cli-project}
      PRESET: example

  render-go-worker:
    desc: render go-worker template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/go-worker
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          ./templates/global/git-hook
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/global/kustomize
    env:
      NAME:
        sh: echo ${NAME:-go-worker-project}
      PRESET: example

  render-chi-api:
    desc: render chi-api template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/chi-api
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          ./templates/global/git-hook
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          --no-prompt=true \
          --preset=example \
          ./templates/global/kustomize
    env:
      NAME:
        sh: echo ${NAME:-chi-api-project}
      PRESET:
        sh: echo ${PRESET:-with-resilient}

  render-go-event-sourcing-cli:
    desc: render go-event-sourcing-cli template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/go-event-sourcing-cli
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          ./templates/global/git-hook
    env:
      NAME:
        sh: echo ${NAME:-go-event-sourcing-cli-project}
      PRESET: example

  render-go-event-sourcing-service:
    desc: render go-event-sourcing-service template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/go-event-sourcing-service
    env:
      NAME:
        sh: echo ${NAME:-go-event-sourcing-service-project}
      PRESET:
        sh: echo ${PRESET:-example}

  test-go-event-sourcing-service-process-manager:
    desc: check that the process manager added to a project later gives the same files as the process manager chosen at the start
    preconditions:
      - command -v scaffold
      - command -v ast-grep
    cmds:
      - rm -rf ./tmp/process-manager
      - scaffold --run-hooks=never new --output-dir=./tmp/process-manager/at-start --no-prompt=true --preset=example ./templates/go-event-sourcing-service
      - scaffold --run-hooks=never new --output-dir=./tmp/process-manager/later --no-prompt=true --preset=minimal ./templates/go-event-sourcing-service
      - |
        cd ./tmp/process-manager/later/go-event-sourcing-service-project
        scaffold --run-hooks=always new --output-dir=. --no-prompt=true --force ../../../../templates/global/go-event-sourcing-service-process-manager
      - diff -r ./tmp/process-manager/at-start ./tmp/process-manager/later

  render-asdf-plugin:
    desc: render asdf-plugin template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/asdf-plugin
    env:
      NAME:
        sh: echo ${NAME:-asdf-plugin-boilerplate}
      PRESET: example
