version: '3'

tasks:
  render-go-cli:
    desc: render go-cli template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/go-cli
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          ./templates/global/git-hook
    env:
      NAME:
        sh: echo ${NAME:-go-cli-project}
      PRESET: example

  render-go-worker:
    desc: render go-worker template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/go-worker
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          ./templates/global/git-hook
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/global/kustomize
    env:
      NAME:
        sh: echo ${NAME:-go-worker-project}
      PRESET: example

  render-chi-api:
    desc: render chi-api template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/chi-api
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          ./templates/global/git-hook
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          --no-prompt=true \
          --preset=example \
          ./templates/global/kustomize
    env:
      NAME:
        sh: echo ${NAME:-chi-api-project}
      PRESET:
        sh: echo ${PRESET:-with-resilient}

  render-go-event-sourcing-cli:
    desc: render go-event-sourcing-cli template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/go-event-sourcing-cli
      - |
        scaffold new \
          --output-dir=./tmp/${NAME} \
          ./templates/global/git-hook
    env:
      NAME:
        sh: echo ${NAME:-go-event-sourcing-cli-project}
      PRESET: example

  render-go-event-sourcing-service:
    desc: render go-event-sourcing-service template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/go-event-sourcing-service
    env:
      NAME:
        sh: echo ${NAME:-go-event-sourcing-service-project}
      PRESET:
        sh: echo ${PRESET:-example}

  test-go-event-sourcing-service-process-manager:
    desc: check that the process manager added to a project later gives the same files as the process manager chosen at the start
    preconditions:
      - command -v scaffold
      - command -v ast-grep
    cmds:
      - rm -rf ./tmp/process-manager
      - scaffold --run-hooks=never new --output-dir=./tmp/process-manager/at-start --no-prompt=true --preset=example ./templates/go-event-sourcing-service
      - scaffold --run-hooks=never new --output-dir=./tmp/process-manager/later --no-prompt=true --preset=minimal ./templates/go-event-sourcing-service
      - |
        cd ./tmp/process-manager/later/go-event-sourcing-service-project
        scaffold --run-hooks=always new --output-dir=. --no-prompt=true --force ../../../../templates/global/go-event-sourcing-service-process-manager
      - diff -r ./tmp/process-manager/at-start ./tmp/process-manager/later

  test-go-cli-auth:
    desc: add go-cli-auth with each preset to a go-cli project and to a go-event-sourcing-cli project, then run their unit tests and the auth e2e tests
    preconditions:
      - command -v scaffold
      - command -v ast-grep
      - command -v jq
      - command -v npx
    cmds:
      - rm -rf ./tmp/go-cli-auth
      - scaffold --run-hooks=always new --output-dir=./tmp/go-cli-auth/base --no-prompt=true --preset=example ./templates/go-cli
      - scaffold --run-hooks=always new --output-dir=./tmp/go-cli-auth/base --no-prompt=true --preset=example ./templates/go-event-sourcing-cli
      - for: [api-key, api-key-stored, oauth]
        task: test-go-cli-auth-preset
        vars:
          PRESET: '{{.ITEM}}'

  test-go-cli-auth-preset:
    internal: true
    cmds:
      - |
        for project in go-cli-project go-event-sourcing-cli-project; do
          dir=./tmp/go-cli-auth/{{.PRESET}}/$project
          mkdir -p ./tmp/go-cli-auth/{{.PRESET}}
          cp -R ./tmp/go-cli-auth/base/$project $dir
          (cd $dir && scaffold --run-hooks=always new --output-dir=. --no-prompt=true --preset={{.PRESET}} {{.TASKFILE_DIR}}/templates/global/go-cli-auth)
          (cd $dir && go vet -tags=unit ./... && go test -race -tags=unit ./...)
        done
      - |
        cd ./tmp/go-cli-auth/{{.PRESET}}/go-cli-project
        CGO_ENABLED=0 go build -o ./bin/go-cli-project-e2e ./cmd/go-cli-project
        cd e2e && EXECUTABLE=../bin/go-cli-project-e2e BUILD_TAG=v0.1.0 npx vitest run tests/auth.test.ts

  test-go-cli-sub-command:
    desc: add go-cli-sub-command to a go-cli project, add the new command to the root command as its post message says, then run the tests
    preconditions:
      - command -v scaffold
      - command -v npx
    cmds:
      - rm -rf ./tmp/go-cli-sub-command
      - scaffold --run-hooks=always new --output-dir=./tmp/go-cli-sub-command --no-prompt=true --preset=example ./templates/go-cli
      - |
        cd ./tmp/go-cli-sub-command/go-cli-project
        scaffold --run-hooks=always new --output-dir=. --no-prompt=true --preset=example {{.TASKFILE_DIR}}/templates/global/go-cli-sub-command
        perl -0pi -e 's/(\t\t\tnewUpdateCommand\(\),\n)/$1\t\t\tnewGreetSubcommand(),\n/' internal/cmd/root.go
        grep -qF 'newGreetSubcommand()' internal/cmd/root.go
        go vet -tags=unit ./...
        go test -race -tags=unit ./...
        CGO_ENABLED=0 go build -o ./bin/go-cli-project-e2e ./cmd/go-cli-project
        cd e2e && EXECUTABLE=../bin/go-cli-project-e2e BUILD_TAG=v0.1.0 npx vitest run tests/greet.test.ts

  render-asdf-plugin:
    desc: render asdf-plugin template to a temporary folder for verification
    preconditions:
      - command -v scaffold
    cmds:
      - rm -rfv ./tmp/${NAME}
      - |
        scaffold \
          --run-hooks=true \
          new \
          --output-dir=./tmp \
          --no-prompt=true \
          --preset=${PRESET} \
          ./templates/asdf-plugin
    env:
      NAME:
        sh: echo ${NAME:-asdf-plugin-boilerplate}
      PRESET: example
